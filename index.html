<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Cloudflare Pages</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #f37021, #f6821f);
            color: white;
            text-align: center;
        }
        .container {
            padding: 2rem;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: 2.5rem;
        }
        p {
            margin: 0;
            opacity: 0.9;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <p>Deployment successful.</p>
    </div>
</body>
</html>
